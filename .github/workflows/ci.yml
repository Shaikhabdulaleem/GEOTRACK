name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  web:
    name: Web checks
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: Figma
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 10
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
          cache-dependency-path: Figma/pnpm-lock.yaml
      - run: pnpm install --frozen-lockfile
      - run: pnpm check

  database:
    name: Database migrations & SQL tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: supabase/setup-cli@v1
        with:
          # Pinned, not "latest": resolving "latest" calls the GitHub API and
          # flakily fails with "rate limit exceeded" on shared CI runners.
          version: 2.120.0
      - name: Start local Supabase stack (applies all migrations)
        run: supabase start -x studio,realtime,storage-api,imgproxy,inbucket,edge-runtime,logflare,vector,pgbouncer
      - name: Run transactional SQL tests (each rolls back)
        env:
          # Stable default for the local Supabase Postgres container.
          DB_URL: postgresql://postgres:postgres@127.0.0.1:54322/postgres
        run: |
          set -euo pipefail
          for t in supabase/tests/rls_smoke.sql \
                   supabase/tests/recurring_schedule_resolver.sql \
                   supabase/tests/e2e_workflow.sql; do
            echo "::group::$t"
            psql "$DB_URL" -v ON_ERROR_STOP=1 -f "$t"
            echo "::endgroup::"
          done
      - name: Stop Supabase
        if: always()
        run: supabase stop --no-backup || true

  android:
    name: Android checks
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: android-app
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: gradle/actions/setup-gradle@v4
      - run: ./gradlew testDebugUnitTest lintDebug assembleDebug --warning-mode all
