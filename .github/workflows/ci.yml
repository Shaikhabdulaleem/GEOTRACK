name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  dependency-review:
    name: Dependency vulnerability review
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 10
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Audit web dependency lockfile
        working-directory: Figma
        run: pnpm audit --audit-level high
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: gradle/actions/setup-gradle@v4
      - name: Resolve Android dependency graph as CycloneDX
        working-directory: android-app
        run: ./gradlew cyclonedxBom --warning-mode all
      - name: Install Trivy
        uses: aquasecurity/setup-trivy@81e514348e19b6112ce2a7e3ecbafe19c1e1f567 # v0.3.1
        with:
          version: v0.76.2
          cache: true
      - name: Scan Android dependency graph
        run: >-
          trivy sbom android-app/build/reports/cyclonedx/bom.json
          --scanners vuln
          --severity HIGH,CRITICAL
          --exit-code 1

  web:
    name: Web checks
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: Figma
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 10
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
          cache-dependency-path: Figma/pnpm-lock.yaml
      - run: pnpm install --frozen-lockfile
      - run: pnpm check

  database:
    name: Database migrations & SQL tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: supabase/setup-cli@v1
        with:
          # Pinned, not "latest": resolving "latest" calls the GitHub API and
          # flakily fails with "rate limit exceeded" on shared CI runners.
          version: 3.1.0
      - name: Start local Supabase stack (applies all migrations)
        run: supabase start -x studio,realtime,storage-api,imgproxy,inbucket,edge-runtime,logflare,vector,pgbouncer
      - name: Run transactional SQL tests (each rolls back)
        env:
          # Stable default for the local Supabase Postgres container.
          DB_URL: postgresql://postgres:postgres@127.0.0.1:54322/postgres
        run: |
          set -euo pipefail
          for t in supabase/tests/rls_smoke.sql \
                   supabase/tests/recurring_schedule_resolver.sql \
                   supabase/tests/auto_close_attendance.sql \
                   supabase/tests/e2e_workflow.sql \
                   supabase/tests/device_authorization.sql \
                   supabase/tests/dashboard_reporting.sql \
                   supabase/tests/geofence_breach_detection.sql \
                   supabase/tests/overtime_review.sql; do
            echo "::group::$t"
            psql "$DB_URL" -v ON_ERROR_STOP=1 -f "$t"
            echo "::endgroup::"
          done
      - name: Stop Supabase
        if: always()
        run: supabase stop --no-backup || true

  android:
    name: Android checks
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: android-app
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: gradle/actions/setup-gradle@v4
      - run: ./gradlew testDebugUnitTest lintDebug assembleDebug --warning-mode all

  android-upgrade-regression:
    name: Android v4-to-v5 upgrade regression (emulator)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: gradle/actions/setup-gradle@v4
      - name: Enable KVM
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' \
            | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm
      - name: Run real Room v4-to-v5 migration regression
        uses: reactivecircus/android-emulator-runner@4c44018e59b437e86cdfc41da381398f93ed8808 # v2
        with:
          api-level: 35
          arch: x86_64
          profile: pixel_6
          working-directory: android-app
          script: ./gradlew connectedDebugAndroidTest -Pandroid.testInstrumentationRunnerArguments.class=com.geotrack.mobile.database.OfflineAttendanceMigrationTest --warning-mode all
